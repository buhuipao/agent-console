[package]
name = "agent-console"
version = "0.3.0"
edition = "2024"
description = "Local terminal dashboard for Codex, Claude Code, and pi sessions."
repository = "https://github.com/buhuipao/agent-console"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["cli", "tui", "codex", "claude", "agent"]
# "pi" is deliberately left out of `keywords`: crates.io allows five, and a
# two-letter term is not what anyone searches for.
categories = ["command-line-utilities", "development-tools"]
exclude = ["docs/assets/*", "tests/fixtures/*", "target/*"]

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
crossterm = "0.29"
dirs = "6"
libc = "0.2"
mime_guess = "2.0.5"
portable-pty = "0.9"
ratatui = "0.30"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rust-embed = "8.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
toml = "0.8"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.16"

[dev-dependencies]
tempfile = "3"
# `Router::oneshot`, so route wiring can be asserted without binding a port.
tower = { version = "0.5", features = ["util"] }
