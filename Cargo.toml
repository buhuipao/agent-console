[package]
name = "agent-console"
version = "0.0.10"
edition = "2024"
publish = false

[dependencies]
crossterm = "0.29"
dirs = "6"
libc = "0.2"
portable-pty = "0.9"
ratatui = "0.30"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.16"

[dev-dependencies]
tempfile = "3"
