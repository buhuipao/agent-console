name: Package release

on:
  push:
    branches:
      - "packaging-test/**"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      publish:
        description: Create or update a GitHub Release (requires an existing tag)
        type: boolean
        default: false
      tag:
        description: Existing tag to publish, for example v0.0.2
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      publish: ${{ steps.metadata.outputs.publish }}
      source_ref: ${{ steps.metadata.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.ref || (inputs.publish && inputs.tag || github.sha) }}
      - name: Validate release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test -n "$version"

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            source_ref="${GITHUB_REF}"
            publish=true
          elif [[ "${{ inputs.publish }}" == "true" ]]; then
            tag="${{ inputs.tag }}"
            source_ref="$tag"
            publish=true
          else
            tag="v${version}"
            source_ref="${GITHUB_SHA}"
            publish=false
          fi

          if [[ "$publish" == true && -z "$tag" ]]; then
            echo "A tag is required when publish is enabled" >&2
            exit 1
          fi
          if [[ "$publish" == true && "$tag" != "v${version}" ]]; then
            echo "Tag $tag does not match Cargo version $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

  quality:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
      - name: Install Rust target
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add "${{ matrix.target }}"
      - name: Build
        shell: bash
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Package Unix binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          archive="agent-console-v${VERSION}-${TARGET}"
          mkdir -p "dist/${archive}"
          install -m 755 "target/${TARGET}/release/agent-console-prototype" "dist/${archive}/agent-console"
          cp README.md "dist/${archive}/README.md"
          tar -C dist -czf "dist/${archive}.tar.gz" "$archive"
          rm -rf "dist/${archive}"
      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "agent-console-v$env:VERSION-$env:TARGET"
          $directory = Join-Path "dist" $archive
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          Copy-Item "target/$env:TARGET/release/agent-console-prototype.exe" "$directory/agent-console.exe"
          Copy-Item "README.md" "$directory/README.md"
          Compress-Archive -Path "$directory/*" -DestinationPath "dist/$archive.zip"
          Remove-Item -Recurse -Force $directory
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  release:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, quality, build]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
      - name: Download packages
        uses: actions/download-artifact@v5
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum agent-console-* > SHA256SUMS
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --verify-tag \
              --generate-notes \
              --title "Agent Console $TAG"
          fi
